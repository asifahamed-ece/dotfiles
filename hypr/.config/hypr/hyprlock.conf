# ===== BACKGROUND =====
# Keep the main background image and blur settings from your original file
background {
  path = /home/shadow/Pictures/wallpapers/golden_cosmic_vortex_in_deep_space.jpg
  blur_passes = 2
  blur_size = 8
  vibrancy = 0.2
  brightness = 0.6
}

# ===== LEFT-SIDE CONTENT (Clock, Date, User, Name) =====
# Clock - Positioned on the left
label {
  text = cmd[update:1000] echo "<span>$(date +'%H:%M')</span>"
  font_size = 90
  font_family = Mogra regular
  position = -350, 150 # Negative x to shift left
  halign = center
  valign = center
  color = rgba(225, 228, 218, 0.9)
}

# Date - Positioned below the clock on the left
label {
  text = cmd[update:1000] echo "<span>$(date +'%A, %d %B')</span>"
  font_size = 18
  font_family = JetBrainsMono Nerd Font Propo
  position = -350, 50 # Negative x to shift left
  halign = center
  valign = center
  color = rgba(225, 228, 218, 0.7)
}

# User Image - Positioned on the left, to the right of the logo area
image {
  path = $HOME/.config/hypr/walls/Shadow_Piano_cut.png
  size = 120
  border_size = 3
  border_color = rgba(166, 211, 149, 0.8) # Keep your accent color for the border
  position = -250, -80 # Positioned to the right of the logo area (e.g., -350)
  halign = center
  valign = center
}

# Username - Positioned below the image on the left
label {
  text = $USER
  font_size = 16
  font_family = JetBrainsMono Nerd Font Propo
  position = -250, -160 # Aligned with the image
  halign = center
  valign = center
  color = rgba(225, 228, 218, 0.9)
}

# ===== ARCH LINUX LOGO WITH SEPARATION (To the LEFT of the User Image) =====
# Add a semi-transparent rectangle behind the logo for visual separation from the bg
rectangle {
  size = 100, 100 # Size slightly larger than the logo itself (e.g., 80px logo + padding)
  color = rgba(29, 32, 33, 0.5) # Dark base color from your theme, semi-transparent
  border_size = 0
  position = -350, -80 # Align with the planned logo position
  halign = center
  valign = center
  # This rectangle sits behind the logo and provides visual separation against the blurred bg.
}

# Now place the crisp PNG logo on top of this backdrop
image {
  path = $HOME/.config/hypr/walls/Arch_Wavy.jpg # Use the PNG version for clarity
  size = 120 # Adjust size as needed
  # DO NOT apply color tint
  position = -450, -80 # Exactly on top of the rectangle
  halign = center
  valign = center
  # This logo should now appear sharp and separated by the semi-transparent rectangle behind it.
}

# ===== PROMINENT PASSWORD INPUT FIELD (Positioned BELOW the user info on the left) =====
# Now aligned with the user image/username column (x = -250)
input-field {
  size = 400, 60 # Increased width and height for visibility
  position = -250, -290 # Align with user info column, y adjusted to be below user info
  halign = center
  valign = center
  dots_center = true
  fade_on_empty = true
  font_family = SF Pro Display Semibold, JetBrainsMono Nerd Font Propo
  font_size = 16 # Slightly larger text
  outline_thickness = 2 # Add a visible outline
  outline_color = rgba(166, 211, 149, 0.8) # Use your accent color for the outline
  inner_color = rgba(29, 32, 33, 0.8) # Slightly more opaque inner background
  outer_color = rgba(0, 0, 0, 0.0) # Make the outer background nearly invisible
  check_color = rgba(166, 211, 149, 0.9) # Brighter check color
  fail_color = rgba(245, 60, 60, 0.9) # Brighter fail color
  placeholder_text = "<span>Enter Password...</span>"
  placeholder_color = rgba(225, 228, 218, 0.6) # Make placeholder text visible
}

# ===== OPTIONAL: SUBTLE LINE UNDER INPUT (for extra definition) =====
# Adds a thin line just below the input field for visual separation/clarity
# Now aligned with the input field column (x = -250)
rectangle {
  size = 400, 2 # Match the input field width closely
  color = rgba(166, 211, 149, 0.5) # Use your accent color
  position = -250, -235 # Positioned just below the input field (relative to input y=-290)
  halign = center
  valign = center
}
